name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  node:
    name: Lint, test, build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - name: Built sites contain index.html and config.js
        run: |
          for app in control admin; do
            test -s "apps/${app}/dist/index.html" || { echo "apps/${app}/dist/index.html missing"; exit 1; }
            test -s "apps/${app}/dist/config.js" || { echo "apps/${app}/dist/config.js missing"; exit 1; }
          done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/lib/*.sh
      - name: bash -n
        run: for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.9"
      - run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  containers:
    name: Container build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfile present
        run: test -f "apps/${{ matrix.app }}/Dockerfile" || { echo "apps/${{ matrix.app }}/Dockerfile missing"; exit 1; }
      - name: Build (repo root is the context)
        run: docker build -f "apps/${{ matrix.app }}/Dockerfile" -t "blr-${{ matrix.app }}:ci" .
      - name: Run and probe /healthz (api only)
        if: matrix.app == 'api'
        run: |
          # Dev env on purpose: no GCP credentials exist in CI, so only liveness is checked here.
          docker run -d --name blr-api-ci -p 8080:8080 -e PORT=8080 -e NODE_ENV=development -e AUTH_MODE=dev blr-api:ci  # lint-allow-dev
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs blr-api-ci
          exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation-owned repos need a (free) licence key from gitleaks.io; personal repos do not.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
